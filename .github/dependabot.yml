version: 2

updates:
  # Versi action di workflow CI (checkout, setup-php, cache).
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # Paket PHP (composer.json dan composer.lock).
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"